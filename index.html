<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>졸음 예방 및 자세 감지 앱</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; }
        #webcam-container {
            margin: 20px auto;
            border: 4px solid #333;
            border-radius: 50%;
            width: 400px;
            height: 400px;
            background-color: #ddd;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #webcam-container canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #label-container {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .normal { color: #2ecc71; background-color: #e8f8f5; }
        .sleeping { color: #e74c3c; background-color: #fadbd8; }
        .error { color: #c0392b; background-color: #fadbd8; border: 1px solid #e74c3c; }
        
        #start-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        #start-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>😴 졸음 감지 시스템</h1>
    <p>웹캠을 켜고 시작 버튼을 누르면 감지가 시작됩니다.</p>
    <button id="start-btn" onclick="init()">시작하기 (웹캠/오디오 권한 허용)</button>
    
    <div id="webcam-container"></div>
    <div id="label-container">대기 중...</div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // Teachable Machine 모델 URL 설정
        const URL = "https://teachablemachine.withgoogle.com/models/KgK8J7Kc2/";

        let model, webcam, labelContainer, maxPredictions;
        let audioCtx = null;
        let isPlaying = false; 
        let animationFrameId = null;

        // 크로미움 브라우저 보안 환경 체크
        function checkSecureContext() {
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                alert("⚠️ 크로미움/브레이브 브라우저 정책상 보안 연결(HTTPS) 또는 localhost 주소에서만 웹캠 실행이 가능합니다.");
                return false;
            }
            return true;
        }

        // 오디오 컨텍스트 초기화 (사용자 클릭 직후 실행하여 자동재생 정책 우회)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 경고음 발생 함수
        function playAlertSound() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5); // 0.5초 동안 비프음 재생
        }

        // 시스템 시작
        async function init() {
            if (!checkSecureContext()) return;
            initAudio(); // 오디오 깨우기

            document.getElementById("start-btn").style.display = "none";
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "모델 및 카메라 로딩 중...";
            labelContainer.className = "";

            try {
                // 기존 재생 스트림 및 애니메이션 프레임 정리
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (webcam && webcam.stream) {
                    webcam.stream.getTracks().forEach(track => track.stop());
                }

                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // 1. 모델 로드
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // 2. 웹캠 생성 및 설정 (데스크톱 단일 웹캠 에러 방지를 위해 옵션 최소화)
                const flip = true;
                webcam = new tmImage.Webcam(400, 400, flip);
                
                // facingMode 조건 없이 기본 시스템 카메라 호출하여 에러 방지
                await webcam.setup(); 

                // HTML5 비디오 표준 호환성 태그 강제 삽입
                if (webcam.webcam) {
                    webcam.webcam.setAttribute('playsinline', 'true');
                    webcam.webcam.setAttribute('muted', 'true');
                    webcam.webcam.muted = true;
                }

                await webcam.play();
                
                // 3. 감지 루프 실행
                animationFrameId = window.requestAnimationFrame(loop);

                const container = document.getElementById("webcam-container");
                container.innerHTML = "";
                container.appendChild(webcam.canvas);
                
                labelContainer.innerHTML = "감지 중...";
                labelContainer.className = "normal";

            } catch (error) {
                console.error("카메라 연결 실패:", error);
                labelContainer.innerHTML = "🚨 웹캠을 불러올 수 없습니다. 권한이 차단되었거나 기기가 연결되지 않았습니다.";
                labelContainer.className = "error";
                document.getElementById("start-btn").style.display = "inline-block";
            }
        }

        // 반복 실행 프레임 루프
        async function loop() {
            if (webcam && webcam.canvas) {
                webcam.update();
                await predict();
            }
            animationFrameId = window.requestAnimationFrame(loop);
        }

        // 학습된 모델 예측 및 비프음 트리거
        async function predict() {
            if (!model || !webcam || !webcam.canvas) return;

            const prediction = await model.predict(webcam.canvas);
            
            let highestClass = "";
            let highestProbability = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) {
                    highestProbability = prediction[i].probability;
                    highestClass = prediction[i].className;
                }
            }

            // 클래스명 유연한 체크 (자다, 졸음, sleep, 엎드림 등 포괄)
            const isSleeping = highestClass.includes("자") || 
                               highestClass.toLowerCase().includes("sleep") || 
                               highestClass.includes("엎드");

            if (isSleeping && highestProbability > 0.85) {
                labelContainer.innerHTML = `🚨 엎드림 감지! (${(highestProbability * 100).toFixed(0)}%)`;
                labelContainer.className = "sleeping";
                
                if (!isPlaying) {
                    isPlaying = true;
                    playAlertSound();
                    setTimeout(() => { isPlaying = false; }, 2000); // 알람 간격 2초 딜레이
                }
            } else if (!isSleeping) {
                labelContainer.innerHTML = `✅ 정상 상태 (${(highestProbability * 100).toFixed(0)}%)`;
                labelContainer.className = "normal";
            }
        }
    </script>
</body>
</html>
