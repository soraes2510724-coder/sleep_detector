<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>졸음 예방 및 자세 감지 앱</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; }
        #webcam-container {
            margin: 20px auto;
            border: 4px solid #333;
            border-radius: 10px;
            width: 400px;
            height: 400px;
            background-color: #ddd;
            overflow: hidden;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #webcam-container canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #label-container {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .normal { color: #2ecc71; background-color: #e8f8f5; }
        .sleeping { color: #e74c3c; background-color: #fadbd8; }
        
        /* 알람음 시작 버튼 */
        #start-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        #start-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>😴 졸음 감지 시스템</h1>
    <p>웹캠을 켜고 시작 버튼을 누르면 감지가 시작됩니다.</p>
    <button id="start-btn" onclick="init()">시작하기 (웹캠/오디오 권한 허용)</button>
    
    <div id="webcam-container"></div>
    <div id="label-container">대기 중...</div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // 1. Teachable Machine 모델 URL 설정
        const URL = "https://teachablemachine.withgoogle.com/models/KgK8J7Kc2/";

        let model, webcam, labelContainer, maxPredictions;
        let audioCtx = null; // 오디오 컨텍스트 전역 관리
        let alertInterval = null; // 반복 재생을 제어할 타이머 변수

        // 브라우저 호환성을 고려한 오디오 컨텍스트 초기화
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 경고음(Beep) 생성 함수 (0.5초 동안 소리 재생)
        function playAlertSound() {
            if (!audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); 

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5); 
        }

        // 반복 경고음 시작 함수
        function startAlarm() {
            if (alertInterval === null) {
                // 최초 1회 즉시 실행 후, 0.6초(600ms) 간격으로 반복하여 소리 재생 (소리 길이 0.5초보다 약간 길게 잡음)
                playAlertSound();
                alertInterval = setInterval(playAlertSound, 600);
            }
        }

        // 경고음 정지 함수
        function stopAlarm() {
            if (alertInterval !== null) {
                clearInterval(alertInterval);
                alertInterval = null;
            }
        }

        // 앱 초기화 및 시작
        async function init() {
            initAudio();

            document.getElementById("start-btn").style.display = "none";
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "모델 로딩 중...";

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true; 
                webcam = new tmImage.Webcam(400, 400, flip); 
                await webcam.setup(); 

                if (webcam.webcam) {
                    webcam.webcam.setAttribute('playsinline', true);
                    webcam.webcam.setAttribute('muted', true);
                }

                await webcam.play();
                window.requestAnimationFrame(loop);

                const container = document.getElementById("webcam-container");
                container.innerHTML = ""; 
                container.appendChild(webcam.canvas);
                
                labelContainer.innerHTML = "감지 중...";
                labelContainer.className = "normal";

            } catch (error) {
                console.error("초기화 실패:", error);
                labelContainer.innerHTML = "⚠️ 카메라/마이크 권한을 허용했는지 확인해주세요.";
                labelContainer.style.backgroundColor = "#fadbd8";
                labelContainer.style.color = "#e74c3c";
                document.getElementById("start-btn").style.display = "inline-block"; 
            }
        }

        // 반복 실행 루프
        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        // 예측 및 판단
        async function predict() {
            if (!model || !webcam) return;

            const prediction = await model.predict(webcam.canvas);
            
            let highestClass = "";
            let highestProbability = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) {
                    highestProbability = prediction[i].probability;
                    highestClass = prediction[i].className;
                }
            }

            const isSleeping = highestClass.includes("자") || 
                               highestClass.toLowerCase().includes("sleep") || 
                               highestClass.includes("엎드");

            if (isSleeping && highestProbability > 0.85) {
                labelContainer.innerHTML = `🚨 엎드림 감지! (${(highestProbability * 100).toFixed(0)}%)`;
                labelContainer.className = "sleeping";
                
                // 누워있는 동안 경고음 무한 반복 시작
                startAlarm();
            } else {
                labelContainer.innerHTML = `✅ 정상 상태 (${(highestProbability * 100).toFixed(0)}%)`;
                labelContainer.className = "normal";
                
                // 정상 상태가 되면 즉시 경고음 정지
                stopAlarm();
            }
        }
    </script>
</body>
</html>
